[package]
name = "openitgo-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Desktop egui application for OpenItGo"

[dependencies]
crossbeam-channel = "0.5"
eframe = { version = "0.35", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.35"
egui_phosphor_icons = "0.4"
bcdec_rs = "0.2"
image = { workspace = true }
texpresso = "2.0"
pdf-render = "1.0.0-beta.9"
rfd = "0.15"
openitgo-core = { path = "../openitgo-core" }
openitgo-media = { path = "../openitgo-media" }
openitgo-parser = { path = "../openitgo-parser" }
openitgo-storage = { path = "../openitgo-storage" }
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
wry = "0.55"
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
percent-encoding = "2"
zip = { version = "2.2", default-features = false, features = ["deflate", "aes-crypto"] }
unrar = "0.5"
# libwebp(SIMD)缩略图解码(webp_thumb.rs):缩放解码 + 全解码兜底。
libwebp-sys = "0.14"
# 解压完成后「删除压缩包」移入回收站。
trash = "5"
# FS watch 自动刷新（文件管理器，views/file_manager_panel.rs PanelWatch）；
# 默认后端：Windows ReadDirectoryChanges / macOS FSEvents / Linux inotify。
notify = "8"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
foreign-types = "0.5"
# NSApplication delegate swizzle for Dock open-file events + mpv CAOpenGLLayer.
# objc2-core-foundation provides CGRect/CGPoint/CGSize with objc2::Encode impls.
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["objc2"] }
cgl = "0.3"

[target.'cfg(target_os = "windows")'.build-dependencies]
# 嵌入 exe 图标资源（build.rs + assets/icon/openitgo.rc）
embed-resource = "3"

[target.'cfg(target_os = "windows")'.dependencies]
# mpv `wid` HWND 子窗口（platform/windows/mpv_view.rs）+ show-text OSD。
# Win32_UI_Shell：文件关联（file_assoc.rs）的 SHChangeNotify / ShellExecuteW。
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }
libmpv-sys = "3.1"
# HKCU\Software\Classes 文件关联注册（platform/windows/file_assoc.rs）。
winreg = "0.55"
# OLE 拖出解压（platform/windows/drag_out.rs）：IDataObject(CF_HDROP)/IDropSource/DoDragDrop。
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_Graphics_Gdi", "Win32_UI_Shell"] }
# `#[implement]` 宏展开引用 windows_core 根 crate，需直接依赖。
windows-core = "0.61"

[dev-dependencies]
tempfile = "3.14"
