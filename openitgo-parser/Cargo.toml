[package]
name = "openitgo-parser"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Comic archive parsers for OpenItGo"

[dependencies]
openitgo-core = { path = "../openitgo-core" }
image = { workspace = true }
zip = { version = "2.2", default-features = false, features = ["deflate", "aes-crypto"] }
unrar = "0.5"
pdf-syntax = "0.5"
epub = "2.1"
mobi = "0.8"
pulldown-cmark = "0.13"
thiserror = { workspace = true }
chardetng = "0.1"
encoding_rs = "0.8"
blake3 = "1.5"
percent-encoding = "2.3"
sevenz-rust2 = "0.19"
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
zstd = "0.13"
bzip2 = "0.6"
crossbeam-channel = "0.5"

[dev-dependencies]
tempfile = "3.14"
