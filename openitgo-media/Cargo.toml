[package]
name = "openitgo-media"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "libmpv playback core for OpenItGo"

[dependencies]
thiserror = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
libmpv-sys = "3.1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
cgl = "0.3"
